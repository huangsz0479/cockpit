name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  rust:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      # Keep in sync with rust-toolchain.toml (the action does not read it).
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mysql: ["mysql:5.7", "mysql:8.0", "mysql:8.4"]
    services:
      mysql:
        image: ${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cockpit_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: cargo test -p cockpit-mysql --test mysql_integration -- --ignored
        env:
          COCKPIT_TEST_MYSQL_HOST: 127.0.0.1
          COCKPIT_TEST_MYSQL_PORT: 3306
          COCKPIT_TEST_MYSQL_USER: root
          COCKPIT_TEST_MYSQL_PASSWORD: root
          COCKPIT_TEST_MYSQL_DATABASE: cockpit_test

  elasticsearch-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd="curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow"
          --health-interval=15s
          --health-timeout=10s
          --health-retries=24
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: cargo test -p cockpit-elasticsearch --test elasticsearch_integration -- --ignored
        env:
          COCKPIT_TEST_ES_HOST: 127.0.0.1
          COCKPIT_TEST_ES_PORT: 9200
