# 手动触发生成 preview 安装包。
# Manually triggered workflow: run it from the Actions page to build preview installers.
name: Desktop installers

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-installers-preview
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
          - platform: windows-latest
            rust_targets: ""
            args: --bundles nsis,msi
          - platform: ubuntu-22.04
            rust_targets: ""
            args: --bundles appimage,deb
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: preview-v__VERSION__
          releaseName: Cockpit v__VERSION__ Preview
          releaseBody: "Automated preview build triggered manually. These packages are not code signed."
          releaseDraft: false
          prerelease: true
          retryAttempts: 1
          args: ${{ matrix.args }}
