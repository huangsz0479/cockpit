name: Release bundles

on:
  workflow_dispatch:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    env:
      APPLE_CERTIFICATE_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      # rust-toolchain.toml overrides the toolchain the action installed, so
      # make sure the universal-apple-darwin targets exist in the one cargo
      # actually resolves to (guards against channel-name drift like "1.88"
      # vs "1.88.0", which rustup treats as two separate toolchains).
      - name: Install macOS universal targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Verify version consistency
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CONF_VERSION="$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")"
          echo "tag version: ${TAG_VERSION}"
          echo "tauri.conf.json version: ${CONF_VERSION}"
          if [ "${TAG_VERSION}" != "${CONF_VERSION}" ]; then
            echo "::error::Tag version ${TAG_VERSION} does not match tauri.conf.json version ${CONF_VERSION}"
            exit 1
          fi
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev
      - run: npm ci
      - name: Build and publish signed bundles
        if: matrix.platform != 'macos-latest' || env.APPLE_CERTIFICATE_CONFIGURED == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: Cockpit v__VERSION__
          releaseBody: "See the assets below for platform installers."
          releaseDraft: false
          args: ${{ matrix.args }}
      - name: Build and publish unsigned macOS bundle
        if: matrix.platform == 'macos-latest' && env.APPLE_CERTIFICATE_CONFIGURED != 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Cockpit v__VERSION__
          releaseBody: "See the assets below for platform installers. The macOS bundle is unsigned."
          releaseDraft: false
          args: ${{ matrix.args }}
