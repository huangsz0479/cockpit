name: Repair Windows release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to repair without moving it
        required: true
        default: v0.0.3
        type: string

permissions:
  contents: write

concurrency:
  group: repair-windows-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WINDOWS_CERTIFICATE_CONFIGURED: ${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
    steps:
      - name: Require Windows code-signing certificate
        if: env.WINDOWS_CERTIFICATE_CONFIGURED != 'true'
        shell: pwsh
        run: throw "Windows releases require the WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD secrets."

      - name: Check out repair automation
        uses: actions/checkout@v6
        with:
          path: automation

      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          path: source

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate tag and version
        shell: pwsh
        working-directory: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match package version $version."
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Import Windows code-signing certificate
        shell: pwsh
        working-directory: source
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: ../automation/.github/scripts/import-windows-code-signing-certificate.ps1

      - name: Build signed MSI
        working-directory: source
        run: npm run tauri build -- --bundles msi

      - name: Verify Windows Authenticode signatures
        shell: pwsh
        working-directory: source
        run: ../automation/.github/scripts/verify-windows-signatures.ps1

      - name: Remove blocked NSIS installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $assetName = "Cockpit_$($env:RELEASE_VERSION)_x64-setup.exe"
          $assetNames = @(
            & gh release view $env:RELEASE_TAG --json assets --jq ".assets[].name" --repo $env:GITHUB_REPOSITORY
          )
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to inspect the existing release assets."
          }
          if ($assetNames -contains $assetName) {
            & gh release delete-asset $env:RELEASE_TAG $assetName --yes --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to remove the blocked NSIS installer."
            }
          }
          else {
            Write-Host "The NSIS asset is already absent: $assetName"
          }

      - name: Replace MSI with signed installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $installers = @(Get-ChildItem "source/src-tauri/target" -Filter "*.msi" -File -Recurse)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one MSI installer, found $($installers.Count)."
          }
          & gh release upload $env:RELEASE_TAG $installers[0].FullName --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload the signed MSI installer."
          }

      - name: Confirm repaired release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $assetNames = @(
            & gh release view $env:RELEASE_TAG --json assets --jq ".assets[].name" --repo $env:GITHUB_REPOSITORY
          )
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to inspect the repaired release assets."
          }
          if ($assetNames -match "_x64-setup\.exe$") {
            throw "The blocked NSIS installer is still present in the release."
          }
          $expectedMsi = "Cockpit_$($env:RELEASE_VERSION)_x64_zh-CN.msi"
          if ($assetNames -notcontains $expectedMsi) {
            throw "The signed MSI installer is missing from the release."
          }
